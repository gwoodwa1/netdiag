name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@0.35.0
        with:
          version: 0.71.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: 0
          skip-dirs: .git,.gocache,.gomodcache,cmd/netdiag/netdiag

      - name: Enforce security findings
        run: |
          jq -r '
            .Results[]? as $result
            | (($result.Vulnerabilities // []) + ($result.Misconfigurations // []))[]?
            | select(.Severity == "HIGH" or .Severity == "CRITICAL")
            | [($result.Target // "unknown"), .Severity, (.VulnerabilityID // .ID // "unknown"), (.Title // .Message // "")]
            | @tsv
          ' trivy-results.json | tee /tmp/trivy-findings.txt
          test ! -s /tmp/trivy-findings.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify
        run: ./.github/scripts/verify.sh
